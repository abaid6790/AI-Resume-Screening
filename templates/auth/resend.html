{% extends "base.html" %}

{% block title %}Resend Verification — {{ app_name }}{% endblock %}

{% block content %}
<div class="ars-auth-wrap">
  <div class="ars-card ars-auth-card">
    <div class="ars-auth-brand">
      <span class="ars-brand-mark" aria-hidden="true">RS</span>
    </div>
    <h1 class="ars-auth-title">Resend verification email</h1>
    <p class="ars-subtitle mb-4">Enter the email you registered with.</p>

    <form method="POST" action="{{ url_for('auth.resend') }}" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn ars-btn-primary w-100">Send verification link</button>
    </form>

    <p class="ars-auth-footer">
      <a href="{{ url_for('auth.login') }}">Back to log in</a>
    </p>
  </div>
</div>
{% endblock %}
