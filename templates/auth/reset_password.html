{% extends "base.html" %}

{% block title %}Reset Password — {{ app_name }}{% endblock %}

{% block content %}
<div class="ars-auth-wrap">
  <div class="ars-card ars-auth-card">
    <div class="ars-auth-brand">
      <span class="ars-brand-mark" aria-hidden="true">RS</span>
    </div>
    <h1 class="ars-auth-title">Set a new password</h1>
    <p class="ars-subtitle mb-4">This link is valid for 2 hours from when it was requested.</p>

    <form method="POST" action="{{ url_for('auth.reset_password_route', token=token) }}" novalidate>
      <div class="mb-3">
        <label class="form-label" for="password">New password</label>
        <input class="form-control" type="password" id="password" name="password" minlength="8" required autofocus>
        <div class="form-text">At least 8 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm_password">Confirm new password</label>
        <input class="form-control" type="password" id="confirm_password" name="confirm_password" minlength="8" required>
      </div>
      <button type="submit" class="btn ars-btn-primary w-100">Reset password</button>
    </form>

    <p class="ars-auth-footer">
      <a href="{{ url_for('auth.login') }}">Back to log in</a>
    </p>
  </div>
</div>
{% endblock %}
