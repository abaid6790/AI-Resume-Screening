{% extends "base.html" %}

{% block title %}Log In — {{ app_name }}{% endblock %}

{% block content %}
<div class="ars-auth-wrap">
  <div class="ars-card ars-auth-card">
    <div class="ars-auth-brand">
      <span class="ars-brand-mark" aria-hidden="true">RS</span>
    </div>
    <h1 class="ars-auth-title">Welcome back</h1>
    <p class="ars-subtitle mb-4">Log in to your resume screening dashboard.</p>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required>
        <div class="form-text"><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></div>
      </div>
      <button type="submit" class="btn ars-btn-primary w-100">Log in</button>
    </form>

    <p class="ars-auth-footer">
      New here? <a href="{{ url_for('auth.register') }}">Create an account</a><br>
      Didn't get a verification email? <a href="{{ url_for('auth.resend') }}">Resend it</a>
    </p>
  </div>
</div>
{% endblock %}
