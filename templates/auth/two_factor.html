{% extends "base.html" %}

{% block title %}Two-Factor Verification — {{ app_name }}{% endblock %}

{% block content %}
<div class="ars-auth-wrap">
  <div class="ars-card ars-auth-card">
    <div class="ars-auth-brand">
      <span class="ars-brand-mark" aria-hidden="true">RS</span>
    </div>
    <h1 class="ars-auth-title">Two-factor verification</h1>
    <p class="ars-subtitle mb-4">Enter the 6-digit code from your authenticator app.</p>

    <form method="POST" action="{{ url_for('auth.two_factor') }}" novalidate>
      <div class="mb-3">
        <label class="form-label" for="code">Authentication code</label>
        <input class="form-control ars-otp-input" type="text" id="code" name="code"
               inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required autofocus>
        <div class="form-text">Lost your device? Enter one of your recovery codes instead.</div>
      </div>
      <button type="submit" class="btn ars-btn-primary w-100">Verify</button>
    </form>

    <p class="ars-auth-footer">
      <a href="{{ url_for('auth.login') }}">Cancel and go back</a>
    </p>
  </div>
</div>
{% endblock %}
