{% extends "base.html" %}

{% block title %}Something went wrong — {{ app_name }}{% endblock %}

{% block content %}
<div class="ars-error-state">
  <span class="ars-error-code">500</span>
  <h1>Something went wrong on our end</h1>
  <p>{{ message or "The error has been logged. Please try again in a moment." }}</p>
  <a class="btn ars-btn-primary" href="{{ url_for('dashboard.index') }}">Back to dashboard</a>
</div>
{% endblock %}
